user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Behind the production TLS gateway the peer is a private container
    # address; recover the browser address from the gateway's header so the
    # API can rate-limit sign-in attempts per client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolve the API through Docker DNS at request time. A fixed upstream is
    # resolved once at startup, so recreating the api container (a new IP)
    # would leave this gateway answering 502 until it is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;
        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            return 204;
        }

        set $api_upstream http://api:8000;

        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }

        location = /openapi.json {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
