name: datapipette

x-backend-image: &backend-image
  image: datapipette/backend:${DATAPIPETTE_IMAGE_TAG:-local}

x-app-environment: &app-environment
  DATAPIPETTE_ENVIRONMENT: ${DATAPIPETTE_ENVIRONMENT:-development}
  DATAPIPETTE_LOG_LEVEL: ${DATAPIPETTE_LOG_LEVEL:-INFO}
  DATAPIPETTE_DOCS_ENABLED: ${DATAPIPETTE_DOCS_ENABLED:-true}
  DATAPIPETTE_METADATA_DATABASE_URL: postgresql+psycopg://${DATAPIPETTE_POSTGRES_USER:-datapipette}:${DATAPIPETTE_POSTGRES_PASSWORD:-datapipette_dev_only}@metadata-db:5432/${DATAPIPETTE_POSTGRES_DB:-datapipette}
  DATAPIPETTE_REDIS_URL: redis://redis:6379/0
  DATAPIPETTE_CONNECTION_ENCRYPTION_KEY: ${DATAPIPETTE_CONNECTION_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
  DATAPIPETTE_INSTALLATION_TIMEZONE: ${DATAPIPETTE_INSTALLATION_TIMEZONE:-UTC}
  DATAPIPETTE_OBJECT_STORAGE_BACKEND: s3
  DATAPIPETTE_SNAPSHOT_STORAGE_PATH: /var/lib/datapipette/snapshots
  DATAPIPETTE_S3_ENDPOINT_URL: http://minio:9000
  DATAPIPETTE_S3_REGION: ${DATAPIPETTE_S3_REGION:-us-east-1}
  DATAPIPETTE_S3_BUCKET: ${DATAPIPETTE_S3_BUCKET:-datapipette}
  DATAPIPETTE_S3_ACCESS_KEY_ID: ${DATAPIPETTE_S3_ACCESS_KEY_ID:-datapipette_minio}
  DATAPIPETTE_S3_SECRET_ACCESS_KEY: ${DATAPIPETTE_S3_SECRET_ACCESS_KEY:-datapipette_minio_dev_only}
  DATAPIPETTE_S3_ADDRESSING_STYLE: path
  DATAPIPETTE_S3_DOWNLOAD_DELIVERY: proxy
  DATAPIPETTE_SOURCE_CONNECT_TIMEOUT_SECONDS: ${DATAPIPETTE_SOURCE_CONNECT_TIMEOUT_SECONDS:-5}
  DATAPIPETTE_SOURCE_STATEMENT_TIMEOUT_SECONDS: ${DATAPIPETTE_SOURCE_STATEMENT_TIMEOUT_SECONDS:-5}
  DATAPIPETTE_PREVIEW_STATEMENT_TIMEOUT_SECONDS: ${DATAPIPETTE_PREVIEW_STATEMENT_TIMEOUT_SECONDS:-5}
  DATAPIPETTE_PREVIEW_MAX_ROWS: ${DATAPIPETTE_PREVIEW_MAX_ROWS:-200}
  DATAPIPETTE_PREVIEW_MAX_RESPONSE_BYTES: ${DATAPIPETTE_PREVIEW_MAX_RESPONSE_BYTES:-1048576}
  DATAPIPETTE_REFRESH_STATEMENT_TIMEOUT_SECONDS: ${DATAPIPETTE_REFRESH_STATEMENT_TIMEOUT_SECONDS:-1800}
  DATAPIPETTE_REFRESH_MAX_ROWS: ${DATAPIPETTE_REFRESH_MAX_ROWS:-10000000}
  DATAPIPETTE_REFRESH_BATCH_ROWS: ${DATAPIPETTE_REFRESH_BATCH_ROWS:-50000}
  DATAPIPETTE_REFRESH_MAX_ATTEMPTS: ${DATAPIPETTE_REFRESH_MAX_ATTEMPTS:-3}
  DATAPIPETTE_REFRESH_RETRY_BASE_SECONDS: ${DATAPIPETTE_REFRESH_RETRY_BASE_SECONDS:-5}
  DATAPIPETTE_REFRESH_RETRY_MAX_SECONDS: ${DATAPIPETTE_REFRESH_RETRY_MAX_SECONDS:-300}
  DATAPIPETTE_REFRESH_CANCEL_POLL_SECONDS: ${DATAPIPETTE_REFRESH_CANCEL_POLL_SECONDS:-1.0}
  DATAPIPETTE_REFRESH_RUN_LEASE_SECONDS: ${DATAPIPETTE_REFRESH_RUN_LEASE_SECONDS:-30}
  DATAPIPETTE_QUERY_SAFETY_ESTIMATED_ROWS_WARNING: ${DATAPIPETTE_QUERY_SAFETY_ESTIMATED_ROWS_WARNING:-1000000}
  DATAPIPETTE_QUERY_SAFETY_ESTIMATED_ROWS_BLOCK: ${DATAPIPETTE_QUERY_SAFETY_ESTIMATED_ROWS_BLOCK:-10000000}
  DATAPIPETTE_QUERY_SAFETY_TOTAL_COST_WARNING: ${DATAPIPETTE_QUERY_SAFETY_TOTAL_COST_WARNING:-100000}
  DATAPIPETTE_QUERY_SAFETY_TOTAL_COST_BLOCK: ${DATAPIPETTE_QUERY_SAFETY_TOTAL_COST_BLOCK:-1000000}
  DATAPIPETTE_QUERY_SAFETY_JOIN_COUNT_WARNING: ${DATAPIPETTE_QUERY_SAFETY_JOIN_COUNT_WARNING:-5}
  DATAPIPETTE_QUERY_SAFETY_JOIN_COUNT_BLOCK: ${DATAPIPETTE_QUERY_SAFETY_JOIN_COUNT_BLOCK:-9}
  DATAPIPETTE_QUERY_SAFETY_SEQUENTIAL_SCAN_ROWS_WARNING: ${DATAPIPETTE_QUERY_SAFETY_SEQUENTIAL_SCAN_ROWS_WARNING:-250000}
  DATAPIPETTE_QUERY_SAFETY_SORT_ROWS_WARNING: ${DATAPIPETTE_QUERY_SAFETY_SORT_ROWS_WARNING:-500000}
  DATAPIPETTE_QUERY_SAFETY_STALE_STATISTICS_DAYS: ${DATAPIPETTE_QUERY_SAFETY_STALE_STATISTICS_DAYS:-30}
  DATAPIPETTE_SNAPSHOT_QUERY_TIMEOUT_SECONDS: ${DATAPIPETTE_SNAPSHOT_QUERY_TIMEOUT_SECONDS:-10}
  DATAPIPETTE_SNAPSHOT_QUERY_MEMORY_LIMIT_MB: ${DATAPIPETTE_SNAPSHOT_QUERY_MEMORY_LIMIT_MB:-256}
  DATAPIPETTE_SNAPSHOT_QUERY_THREADS: ${DATAPIPETTE_SNAPSHOT_QUERY_THREADS:-2}
  DATAPIPETTE_SNAPSHOT_QUERY_CONCURRENCY: ${DATAPIPETTE_SNAPSHOT_QUERY_CONCURRENCY:-4}
  DATAPIPETTE_SNAPSHOT_QUERY_TEMP_LIMIT_MB: ${DATAPIPETTE_SNAPSHOT_QUERY_TEMP_LIMIT_MB:-512}
  DATAPIPETTE_SNAPSHOT_QUERY_MAX_RESPONSE_BYTES: ${DATAPIPETTE_SNAPSHOT_QUERY_MAX_RESPONSE_BYTES:-2097152}
  DATAPIPETTE_EXPORT_TIMEOUT_SECONDS: ${DATAPIPETTE_EXPORT_TIMEOUT_SECONDS:-1800}
  DATAPIPETTE_EXPORT_MEMORY_LIMIT_MB: ${DATAPIPETTE_EXPORT_MEMORY_LIMIT_MB:-512}
  DATAPIPETTE_EXPORT_THREADS: ${DATAPIPETTE_EXPORT_THREADS:-2}
  DATAPIPETTE_EXPORT_TEMP_LIMIT_MB: ${DATAPIPETTE_EXPORT_TEMP_LIMIT_MB:-2048}
  DATAPIPETTE_EXPORT_MAX_ROWS: ${DATAPIPETTE_EXPORT_MAX_ROWS:-5000000}
  DATAPIPETTE_EXPORT_MAX_BYTES: ${DATAPIPETTE_EXPORT_MAX_BYTES:-1073741824}
  DATAPIPETTE_EXPORT_FETCH_ROWS: ${DATAPIPETTE_EXPORT_FETCH_ROWS:-10000}
  DATAPIPETTE_BACKGROUND_JOB_CONCURRENCY: ${DATAPIPETTE_BACKGROUND_JOB_CONCURRENCY:-2}
  DATAPIPETTE_CLEANUP_ENABLED: ${DATAPIPETTE_CLEANUP_ENABLED:-true}
  DATAPIPETTE_CLEANUP_INTERVAL_SECONDS: ${DATAPIPETTE_CLEANUP_INTERVAL_SECONDS:-300}
  DATAPIPETTE_CLEANUP_BATCH_SIZE: ${DATAPIPETTE_CLEANUP_BATCH_SIZE:-100}
  DATAPIPETTE_CLEANUP_SNAPSHOT_GRACE_SECONDS: ${DATAPIPETTE_CLEANUP_SNAPSHOT_GRACE_SECONDS:-3600}
  DATAPIPETTE_CLEANUP_EXPORT_GRACE_SECONDS: ${DATAPIPETTE_CLEANUP_EXPORT_GRACE_SECONDS:-300}
  DATAPIPETTE_CLEANUP_ORPHAN_GRACE_SECONDS: ${DATAPIPETTE_CLEANUP_ORPHAN_GRACE_SECONDS:-86400}

services:
  metadata-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATAPIPETTE_POSTGRES_DB:-datapipette}
      POSTGRES_USER: ${DATAPIPETTE_POSTGRES_USER:-datapipette}
      POSTGRES_PASSWORD: ${DATAPIPETTE_POSTGRES_PASSWORD:-datapipette_dev_only}
    ports:
      - "127.0.0.1:${DATAPIPETTE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - metadata-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DATAPIPETTE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DATAPIPETTE_S3_ACCESS_KEY_ID:-datapipette_minio}
      MINIO_ROOT_PASSWORD: ${DATAPIPETTE_S3_SECRET_ACCESS_KEY:-datapipette_minio_dev_only}
    ports:
      - "127.0.0.1:${DATAPIPETTE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${DATAPIPETTE_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - minio-data:/data
    restart: unless-stopped

  migrate:
    <<: *backend-image
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      metadata-db:
        condition: service_healthy
    restart: "no"

  minio-init:
    <<: *backend-image
    command: ["datapipette-storage-init"]
    environment: *app-environment
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    <<: *backend-image
    command:
      - datapipette-admin
      - bootstrap-admin
      - --email
      - ${DATAPIPETTE_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      - --display-name
      - ${DATAPIPETTE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Local Administrator}
      - --password-dotenv-file
      - /run/secrets/bootstrap_environment
      - --if-needed
    environment: *app-environment
    secrets:
      - bootstrap_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-image
    command: ["uvicorn", "datapipette.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-environment
    tmpfs:
      - /var/lib/datapipette/snapshots:uid=10001,gid=10001,mode=0700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  worker:
    <<: *backend-image
    command:
      - celery
      - --app
      - datapipette.infrastructure.celery_app:celery_app
      - worker
      - --queues
      - refresh,export
      - --concurrency
      - ${DATAPIPETTE_CELERY_CONCURRENCY:-1}
      - --loglevel
      - INFO
    environment: *app-environment
    tmpfs:
      - /var/lib/datapipette/snapshots:uid=10001,gid=10001,mode=0700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery --app datapipette.infrastructure.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped

  scheduler:
    <<: *backend-image
    command: ["datapipette-scheduler"]
    environment: *app-environment
    tmpfs:
      - /var/lib/datapipette/snapshots:uid=10001,gid=10001,mode=0700
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  frontend:
    image: datapipette/frontend:${DATAPIPETTE_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "${DATAPIPETTE_HTTP_BIND_ADDRESS:-127.0.0.1}:${DATAPIPETTE_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  metadata-data:
    name: ${DATAPIPETTE_METADATA_VOLUME_NAME:-datapipette_metadata-data}
  redis-data:
    name: ${DATAPIPETTE_REDIS_VOLUME_NAME:-datapipette_redis-data}
  minio-data:
    name: ${DATAPIPETTE_MINIO_VOLUME_NAME:-datapipette_minio-data}

secrets:
  bootstrap_environment:
    file: ../../.env
