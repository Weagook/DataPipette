name: datepipette

services:
  metadata-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATEPIPETTE_POSTGRES_DB:-datepipette}
      POSTGRES_USER: ${DATEPIPETTE_POSTGRES_USER:-datepipette}
      POSTGRES_PASSWORD: ${DATEPIPETTE_POSTGRES_PASSWORD:-datepipette_dev_only}
    ports:
      - "${DATEPIPETTE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - metadata-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DATEPIPETTE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DATEPIPETTE_S3_ACCESS_KEY_ID:-datepipette_minio}
      MINIO_ROOT_PASSWORD: ${DATEPIPETTE_S3_SECRET_ACCESS_KEY:-datepipette_minio_dev_only}
    ports:
      - "${DATEPIPETTE_MINIO_PORT:-9000}:9000"
      - "${DATEPIPETTE_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    command:
      - uv
      - run
      - --frozen
      - --package
      - datepipette
      - datepipette-storage-init
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/datepipette/.venv
      UV_LINK_MODE: copy
      DATEPIPETTE_ENVIRONMENT: development
      DATEPIPETTE_OBJECT_STORAGE_BACKEND: s3
      DATEPIPETTE_S3_ENDPOINT_URL: http://minio:9000
      DATEPIPETTE_S3_REGION: ${DATEPIPETTE_S3_REGION:-us-east-1}
      DATEPIPETTE_S3_BUCKET: ${DATEPIPETTE_S3_BUCKET:-datepipette}
      DATEPIPETTE_S3_ACCESS_KEY_ID: ${DATEPIPETTE_S3_ACCESS_KEY_ID:-datepipette_minio}
      DATEPIPETTE_S3_SECRET_ACCESS_KEY: ${DATEPIPETTE_S3_SECRET_ACCESS_KEY:-datepipette_minio_dev_only}
      DATEPIPETTE_S3_ADDRESSING_STYLE: path
    volumes:
      - ../../:/workspace:ro
      - storage-init-venv:/opt/datepipette/.venv
      - uv-cache:/root/.cache/uv
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    command:
      - sh
      - -c
      - >-
        install -d -o nobody -g nogroup /var/lib/datepipette/snapshots &&
        exec uv run --frozen --package datepipette celery
        --app datepipette.infrastructure.celery_app:celery_app worker
        --uid nobody --gid nogroup --queues refresh,export --concurrency 1 --loglevel INFO
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/datepipette/.venv
      UV_LINK_MODE: copy
      DATEPIPETTE_ENVIRONMENT: development
      DATEPIPETTE_METADATA_DATABASE_URL: postgresql+psycopg://datepipette:${DATEPIPETTE_POSTGRES_PASSWORD:-datepipette_dev_only}@metadata-db:5432/${DATEPIPETTE_POSTGRES_DB:-datepipette}
      DATEPIPETTE_REDIS_URL: redis://redis:6379/0
      DATEPIPETTE_CONNECTION_ENCRYPTION_KEY: ${DATEPIPETTE_CONNECTION_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
      DATEPIPETTE_OBJECT_STORAGE_BACKEND: s3
      DATEPIPETTE_SNAPSHOT_STORAGE_PATH: /var/lib/datepipette/snapshots
      DATEPIPETTE_S3_ENDPOINT_URL: http://minio:9000
      DATEPIPETTE_S3_REGION: ${DATEPIPETTE_S3_REGION:-us-east-1}
      DATEPIPETTE_S3_BUCKET: ${DATEPIPETTE_S3_BUCKET:-datepipette}
      DATEPIPETTE_S3_ACCESS_KEY_ID: ${DATEPIPETTE_S3_ACCESS_KEY_ID:-datepipette_minio}
      DATEPIPETTE_S3_SECRET_ACCESS_KEY: ${DATEPIPETTE_S3_SECRET_ACCESS_KEY:-datepipette_minio_dev_only}
      DATEPIPETTE_S3_ADDRESSING_STYLE: path
    volumes:
      - ../../:/workspace:ro
      - worker-venv:/opt/datepipette/.venv
      - uv-cache:/root/.cache/uv
      - snapshot-data:/var/lib/datepipette/snapshots
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run --frozen --package datepipette celery --app datepipette.infrastructure.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  scheduler:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    command:
      - uv
      - run
      - --frozen
      - --package
      - datepipette
      - datepipette-scheduler
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/datepipette/.venv
      UV_LINK_MODE: copy
      DATEPIPETTE_ENVIRONMENT: development
      DATEPIPETTE_METADATA_DATABASE_URL: postgresql+psycopg://datepipette:${DATEPIPETTE_POSTGRES_PASSWORD:-datepipette_dev_only}@metadata-db:5432/${DATEPIPETTE_POSTGRES_DB:-datepipette}
      DATEPIPETTE_REDIS_URL: redis://redis:6379/0
      DATEPIPETTE_INSTALLATION_TIMEZONE: ${DATEPIPETTE_INSTALLATION_TIMEZONE:-UTC}
      DATEPIPETTE_OBJECT_STORAGE_BACKEND: s3
      DATEPIPETTE_SNAPSHOT_STORAGE_PATH: /var/lib/datepipette/snapshots
      DATEPIPETTE_S3_ENDPOINT_URL: http://minio:9000
      DATEPIPETTE_S3_REGION: ${DATEPIPETTE_S3_REGION:-us-east-1}
      DATEPIPETTE_S3_BUCKET: ${DATEPIPETTE_S3_BUCKET:-datepipette}
      DATEPIPETTE_S3_ACCESS_KEY_ID: ${DATEPIPETTE_S3_ACCESS_KEY_ID:-datepipette_minio}
      DATEPIPETTE_S3_SECRET_ACCESS_KEY: ${DATEPIPETTE_S3_SECRET_ACCESS_KEY:-datepipette_minio_dev_only}
      DATEPIPETTE_S3_ADDRESSING_STYLE: path
      DATEPIPETTE_CLEANUP_ENABLED: ${DATEPIPETTE_CLEANUP_ENABLED:-true}
      DATEPIPETTE_CLEANUP_INTERVAL_SECONDS: ${DATEPIPETTE_CLEANUP_INTERVAL_SECONDS:-300}
      DATEPIPETTE_CLEANUP_BATCH_SIZE: ${DATEPIPETTE_CLEANUP_BATCH_SIZE:-100}
      DATEPIPETTE_CLEANUP_SNAPSHOT_GRACE_SECONDS: ${DATEPIPETTE_CLEANUP_SNAPSHOT_GRACE_SECONDS:-3600}
      DATEPIPETTE_CLEANUP_EXPORT_GRACE_SECONDS: ${DATEPIPETTE_CLEANUP_EXPORT_GRACE_SECONDS:-300}
      DATEPIPETTE_CLEANUP_ORPHAN_GRACE_SECONDS: ${DATEPIPETTE_CLEANUP_ORPHAN_GRACE_SECONDS:-86400}
    volumes:
      - ../../:/workspace:ro
      - scheduler-venv:/opt/datepipette/.venv
      - uv-cache:/root/.cache/uv
      - snapshot-data:/var/lib/datepipette/snapshots
    depends_on:
      metadata-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  metadata-data:
  redis-data:
  minio-data:
  worker-venv:
  scheduler-venv:
  storage-init-venv:
  uv-cache:
  snapshot-data:
