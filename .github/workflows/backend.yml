name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "benchmarks/**"
      - ".dockerignore"
      - "deploy/docker/backend.Dockerfile"
      - "deploy/compose/**"
      - "docs/openapi.json"
      - "pyproject.toml"
      - "tools/**"
      - "CHANGELOG.md"
      - "frontend/package.json"
      - "clients/typescript/package.json"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "benchmarks/**"
      - ".dockerignore"
      - "deploy/docker/backend.Dockerfile"
      - "deploy/compose/**"
      - "docs/openapi.json"
      - "pyproject.toml"
      - "tools/**"
      - "CHANGELOG.md"
      - "frontend/package.json"
      - "clients/typescript/package.json"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: datapipette
          POSTGRES_USER: datapipette
          POSTGRES_PASSWORD: datapipette_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapipette -d datapipette"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --package datapipette ruff format --check backend

      - name: Lint
        run: uv run --package datapipette ruff check backend

      - name: Type check
        run: uv run --package datapipette mypy

      - name: Test benchmark tooling
        run: uv run python -m unittest discover -s benchmarks/tests

      - name: Check package versions and changelog
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python3 tools/check_release_version.py "v${version}"

      - name: Check deployment scripts
        run: shellcheck deploy/compose/backup.sh deploy/compose/new-env.sh deploy/compose/healthcheck.sh

      - name: Check production Compose overlay
        run: |
          env_file="$(mktemp -d)/.env"
          deploy/compose/new-env.sh --domain bi.example.com --admin-email admin@example.com --output "${env_file}"
          docker compose --env-file "${env_file}" -f deploy/compose/compose.yaml -f deploy/compose/compose.production.yaml config --quiet

      - name: Apply migrations
        run: uv run --package datapipette alembic -c backend/alembic.ini upgrade head

      - name: Start S3-compatible test storage
        run: |
          docker compose -f deploy/compose/compose.yaml up -d --wait minio
          docker compose -f deploy/compose/compose.yaml build migrate
          docker compose -f deploy/compose/compose.yaml run --rm minio-init

      - name: Check migration drift
        run: uv run --package datapipette alembic -c backend/alembic.ini check

      - name: Test
        run: uv run --package datapipette pytest
        env:
          DATAPIPETTE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          DATAPIPETTE_TEST_S3_BUCKET: datapipette
          DATAPIPETTE_TEST_S3_ACCESS_KEY_ID: datapipette_minio
          DATAPIPETTE_TEST_S3_SECRET_ACCESS_KEY: datapipette_minio_dev_only

      - name: Check migration graph
        run: uv run --package datapipette alembic -c backend/alembic.ini heads

      - name: Check OpenAPI contract drift
        run: |
          uv run --package datapipette python tools/export_openapi.py
          git diff --exit-code -- docs/openapi.json
