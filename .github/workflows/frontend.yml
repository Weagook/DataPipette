name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "clients/typescript/**"
      - ".dockerignore"
      - "deploy/compose/compose.yaml"
      - "deploy/docker/frontend.Dockerfile"
      - "deploy/docker/nginx.conf"
      - "docs/openapi.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "clients/typescript/**"
      - ".dockerignore"
      - "deploy/compose/compose.yaml"
      - "deploy/docker/frontend.Dockerfile"
      - "deploy/docker/nginx.conf"
      - "docs/openapi.json"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            frontend/package-lock.json

      - name: Build generated API client
        run: |
          npm ci --prefix clients/typescript
          npm run generate:check --prefix clients/typescript
          npm run build --prefix clients/typescript

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend

      - name: Type check
        run: npm run typecheck --prefix frontend

      - name: Test
        run: npm test --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Build production frontend image
        run: docker compose -f deploy/compose/compose.yaml build frontend
