[project]
name = "datapipette-workspace"
version = "0.1.0"
description = "DataPipette monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["datapipette"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["--strict-config", "--strict-markers", "--cov=datapipette", "--cov-report=term-missing", "--cov-fail-under=90"]

[tool.coverage.run]
branch = true
concurrency = ["thread", "greenlet"]
source = ["datapipette"]

[tool.coverage.report]
show_missing = true
skip_covered = true
