[project]
name = "datepipette"
version = "0.1.0"
description = "API-first analytics platform for PostgreSQL"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
datepipette = "datepipette.main:run"

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
