[project]
name = "datepipette"
version = "0.1.0"
description = "API-first analytics platform for PostgreSQL"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.6,<6",
    "cryptography>=46,<52",
    "duckdb>=1.4,<2",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pyarrow>=25,<26",
    "pydantic-settings>=2.6,<3",
    "pytz>=2025,<2027",
    "redis>=5.2,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
datepipette = "datepipette.main:run"
datepipette-admin = "datepipette.cli:main"
datepipette-scheduler = "datepipette.scheduler:run"

[dependency-groups]
dev = [
    "httpx2",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
